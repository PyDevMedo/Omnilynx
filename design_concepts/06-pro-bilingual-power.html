<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wendo Studio — Bilingual Pro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060911;
      --surface: rgba(15, 20, 34, 0.78);
      --surface-hover: rgba(22, 29, 48, 0.92);
      --border: rgba(148, 163, 184, 0.13);
      --accent: #6366f1;
      --power-on: #10b981;
      --power-glow: rgba(16, 185, 129, 0.52);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', 'Inter', -apple-system, sans-serif;
      background:
        radial-gradient(circle at 85% 10%, rgba(99, 102, 241, 0.16), transparent 42%),
        radial-gradient(circle at 12% 88%, rgba(16, 185, 129, 0.12), transparent 42%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    html[dir="ltr"] body { font-family: 'Inter', 'Cairo', sans-serif; }

    header {
      padding: 13px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(18px);
      background: rgba(6, 9, 17, 0.86);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #10b981);
      display: grid; place-items: center; font-size: 17px;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
    }
    .status-pill {
      padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .shell { display: grid; grid-template-columns: 256px 1fr; flex: 1; }
    aside {
      border-inline-end: 1px solid var(--border);
      padding: 22px 14px;
      background: rgba(9, 13, 24, 0.72);
      display: flex; flex-direction: column; gap: 7px;
    }
    .nav-btn {
      padding: 10px 14px; border-radius: 11px; color: var(--muted);
      font-size: 13.5px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid transparent; transition: .18s;
      background: transparent; font-family: inherit;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(16,185,129,0.08));
      color: #fff; border-color: rgba(99,102,241,0.38);
    }

    main { padding: 26px 32px; max-width: 1240px; width: 100%; margin: 0 auto; }

    /* Quote Hero Banner */
    .quote-banner {
      padding: 18px 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(16,185,129,0.07));
      border: 1px solid rgba(99,102,241,0.26);
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .quote-text { font-size: 15px; font-weight: 700; color: #f1f5f9; line-height: 1.65; }
    .quote-author { font-size: 12px; color: #a5b4fc; margin-top: 4px; font-weight: 600; }

    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .search {
      width: 280px; padding: 9px 14px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 13px; outline: none;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.18); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.22s ease;
    }
    .card:hover { background: var(--surface-hover); transform: translateY(-2px); }
    .card.is-on {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.09), inset 0 1px 0 rgba(16, 185, 129, 0.18);
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-title { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .card-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .card-desc { font-size: 12.8px; color: #cbd5e1; line-height: 1.6; flex: 1; }

    /* Compact Sleek Glowing Power Button */
    .power-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(148, 163, 184, 0.28);
      background: radial-gradient(circle at 30% 30%, #1e293b, #0b101b);
      color: #64748b;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.7), 0 2px 6px rgba(0,0,0,0.35);
    }
    .power-btn:hover { transform: scale(1.08); border-color: rgba(148,163,184,0.5); }
    .power-btn svg { width: 15px; height: 15px; transition: all 0.22s ease; }

    .power-btn.on {
      border-color: #34d399;
      background: radial-gradient(circle at 35% 30%, #10b981, #047857);
      color: #ffffff;
      box-shadow:
        0 0 12px var(--power-glow),
        0 0 24px rgba(16, 185, 129, 0.22),
        inset 0 1px 2px rgba(255, 255, 255, 0.45);
    }
    .power-btn.on svg {
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.9));
    }

    .card-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 11px; border-top: 1px solid var(--border); gap: 8px;
    }
    .state-tag {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
      background: rgba(148,163,184,0.1); color: var(--muted);
    }
    .card.is-on .state-tag {
      background: rgba(16,185,129,0.16); color: #6ee7b7;
    }

    .btn {
      padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text);
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: rgba(129,140,248,0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">💎</div>
      <div>
        <div style="font-size:15.5px; font-weight:800;" id="brandTitle">ويندو ستوديو · Wendo Studio</div>
        <div style="font-size:11.5px; color:var(--muted);" id="brandSub">منصة تخصيص الويندوز الاحترافية</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:9px;">
      <button class="btn" id="langBtn" onclick="toggleLang()">🌐 English</button>
      <span class="status-pill" id="activeCounter">⚡ 2 Active</span>
      <button class="btn btn-primary" id="newModBtn">✨ + مود جديد</button>
    </div>
  </header>

  <div class="shell">
    <aside>
      <button class="nav-btn active" id="navInstalled"><span>🧩 المودات المثبتة</span><span>17</span></button>
      <button class="nav-btn" id="navTweaks"><span>⚡ تعديلات الويندوز الفورية</span><span>6</span></button>
      <button class="nav-btn" id="navStore"><span>🛒 متجر المودات (معاينة)</span><span>↗</span></button>
      <button class="nav-btn" id="navProcesses"><span>🎛️ مراقب العمليات</span><span>◈</span></button>
      <button class="nav-btn" id="navSettings"><span>⚙️ الإعدادات العامة</span><span>⚙</span></button>

      <div style="margin-top:auto; padding:14px; border-radius:14px; background:rgba(255,255,255,0.03); border:1px solid var(--border);">
        <div style="font-size:12px; font-weight:700; color:#a5b4fc; margin-bottom:4px;" id="tipTitle">💡 نصيحة سريعة</div>
        <div style="font-size:11.8px; color:var(--muted); line-height:1.6;" id="tipBody">
          اضغط على زر الباور الصغير ⏻ في أي كارت لتشغيل أو إيقاف المود فوراً.
        </div>
      </div>
    </aside>

    <main>
      <section class="quote-banner">
        <div>
          <div class="quote-text" id="quoteText"></div>
          <div class="quote-author" id="quoteAuthor"></div>
        </div>
        <button class="btn" id="quoteBtn" onclick="nextQuote()">🔄 اقتباس جديد</button>
      </section>

      <div class="toolbar">
        <div>
          <h1 style="font-size:20px; font-weight:800;" id="pageTitle">🚀 لوحة التحكم بالمودات</h1>
          <p style="font-size:12.8px; color:var(--muted); margin-top:2px;" id="pageSub">
            تحكم كامل بزر الباور المضيء — تشغيل، معاينة، وتخصيص بضغطة واحدة.
          </p>
        </div>
        <input class="search" id="searchInput" oninput="filterMods()" />
      </div>

      <div class="grid" id="modsGrid"></div>
    </main>
  </div>

  <script>
    let lang = 'ar';
    let qIdx = 0;

    const i18n = {
      ar: {
        brandTitle: 'ويندو ستوديو · Wendo Studio',
        brandSub: 'منصة تخصيص الويندوز الاحترافية',
        langBtn: '🌐 English',
        newModBtn: '✨ + مود جديد',
        navInstalled: ['🧩 المودات المثبتة', '17'],
        navTweaks: ['⚡ تعديلات الويندوز الفورية', '6'],
        navStore: ['🛒 متجر المودات (معاينة)', '↗'],
        navProcesses: ['🎛️ مراقب العمليات', '◈'],
        navSettings: ['⚙️ الإعدادات العامة', '⚙'],
        tipTitle: '💡 نصيحة سريعة',
        tipBody: 'اضغط على زر الباور الصغير ⏻ في أي كارت لتشغيل أو إيقاف المود فوراً.',
        quoteBtn: '🔄 اقتباس جديد',
        pageTitle: '🚀 لوحة التحكم بالمودات',
        pageSub: 'تحكم كامل بزر الباور المضيء — تشغيل، معاينة، وتخصيص بضغطة واحدة.',
        searchPh: '🔍 ابحث عن مود بالاسم...',
        onTag: '⚡ يعمل الآن',
        offTag: '⏸️ متوقف',
        settingsBtn: '🎛️ الإعدادات',
        activeTxt: (n) => `⚡ ${n} مودات قيد التشغيل`,
        quotes: [
          { text: '«البساطة هي قمة الاحترافية؛ اجعل أدواتك تعمل في صمت وتمنحك تجربة بصرية مريحة.» ✨', author: '— حكمة التصميم الهندسي · Wendo Studio' },
          { text: '«التفاصيل الصغيرة هي التي تصنع الفارق بين برنامج عادي وتجربة يومية استثنائية.» 💎', author: '— فلسفة واجهات المستخدم' },
          { text: '«الجودة ليست فعلاً عابراً، بل عادة تتجلى في كل زر، وكل حركة، وكل تفصيلة.» 🚀', author: '— أرسطو (بتصرف)' }
        ]
      },
      en: {
        brandTitle: 'Wendo Studio',
        brandSub: 'Professional Windows Customization Suite',
        langBtn: '🌐 العربية',
        newModBtn: '✨ + New Mod',
        navInstalled: ['🧩 Installed Mods', '17'],
        navTweaks: ['⚡ Windows Tweaks', '6'],
        navStore: ['🛒 Explore Store (Preview)', '↗'],
        navProcesses: ['🎛️ Process Monitor', '◈'],
        navSettings: ['⚙️ Settings', '⚙'],
        tipTitle: '💡 Quick Tip',
        tipBody: 'Click the compact power button ⏻ on any card to toggle a mod on or off instantly.',
        quoteBtn: '🔄 New Quote',
        pageTitle: '🚀 Mod Control Center',
        pageSub: 'Precision control with illuminated power switches — toggle, preview, and customize.',
        searchPh: '🔍 Search mods by name...',
        onTag: '⚡ Active',
        offTag: '⏸️ Standby',
        settingsBtn: '🎛️ Options',
        activeTxt: (n) => `⚡ ${n} Mods Active`,
        quotes: [
          { text: '“Simplicity is the ultimate sophistication; great tools work silently and feel effortless.” ✨', author: '— Engineering Philosophy · Wendo Studio' },
          { text: '“Small details are what separate an ordinary utility from an extraordinary daily experience.” 💎', author: '— Craft & UI Design' },
          { text: '“Quality is not an act, it is a habit reflected in every button, motion, and detail.” 🚀', author: '— Aristotle' }
        ]
      }
    };

    const mods = [
      {
        id: 'mica',
        on: true,
        ar: { title: '🪟 زجاج Mica الشفاف', meta: 'الإصدار 1.0.0 · تأثيرات بصرية', desc: 'يضيف خامة Acrylic وMica الزجاجية الأنيقة لنوافذ ويندوز 11 مع تحكم كامل في درجة الشفافية.' },
        en: { title: '🪟 Translucent Mica', meta: 'v1.0.0 · Visuals & FX', desc: 'Applies native Windows 11 Acrylic & Mica backdrop material to active application windows.' }
      },
      {
        id: 'dark',
        on: true,
        ar: { title: '🌙 تعتيم شريط العنوان', meta: 'الإصدار 1.0.0 · مظهر ليلي', desc: 'يفعّل الوضع الليلي الاحترافي على إطارات البرامج وشريط العنوان لراحة العين أثناء العمل ليلاً.' },
        en: { title: '🌙 Force Dark Titlebars', meta: 'v1.0.0 · Dark Theme', desc: 'Enables immersive dark window borders and titlebars across Win32 applications.' }
      },
      {
        id: 'taskbar',
        on: false,
        ar: { title: '🎨 تنسيق شريط المهام', meta: 'الإصدار 1.4.2 · شريط المهام', desc: 'حوّل شريط المهام إلى Dock عائم أنيق مع ألوان مخصصة، زوايا دائرية، وتأثيرات حركة ناعمة.' },
        en: { title: '🎨 Taskbar Styler', meta: 'v1.4.2 · Taskbar', desc: 'Transform the Windows 11 taskbar into a floating dock with custom blur and rounded corners.' }
      },
      {
        id: 'opacity',
        on: false,
        ar: { title: '✨ شفافية النوافذ', meta: 'الإصدار 1.0.0 · تأثيرات بصرية', desc: 'تحكم دقيق في درجة شفافية النوافذ المفتوحة عبر شريط سحب سلس بدون أي تعقيد.' },
        en: { title: '✨ Glass Window Opacity', meta: 'v1.0.0 · Visuals & FX', desc: 'Smooth layered window transparency with real-time slider control.' }
      }
    ];

    function render() {
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('brandTitle').textContent = t.brandTitle;
      document.getElementById('brandSub').textContent = t.brandSub;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('newModBtn').textContent = t.newModBtn;

      ['navInstalled', 'navTweaks', 'navStore', 'navProcesses', 'navSettings'].forEach((id) => {
        const el = document.getElementById(id);
        el.children[0].textContent = t[id][0];
        el.children[1].textContent = t[id][1];
      });

      document.getElementById('tipTitle').textContent = t.tipTitle;
      document.getElementById('tipBody').textContent = t.tipBody;
      document.getElementById('quoteBtn').textContent = t.quoteBtn;
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('pageSub').textContent = t.pageSub;
      document.getElementById('searchInput').placeholder = t.searchPh;

      const q = t.quotes[qIdx % t.quotes.length];
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = q.author;

      const activeCount = mods.filter(m => m.on).length;
      document.getElementById('activeCounter').textContent = t.activeTxt(activeCount);

      const grid = document.getElementById('modsGrid');
      grid.innerHTML = mods.map((m, idx) => {
        const copy = m[lang];
        return `
          <article class="card ${m.on ? 'is-on' : ''}" data-search="${(m.ar.title + ' ' + m.en.title + ' ' + copy.desc).toLowerCase()}">
            <div class="card-head">
              <div>
                <div class="card-title">${copy.title}</div>
                <div class="card-meta">${copy.meta}</div>
              </div>
              <button class="power-btn ${m.on ? 'on' : ''}" onclick="toggleMod(${idx})" title="Power">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                  <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
              </button>
            </div>
            <p class="card-desc">${copy.desc}</p>
            <div class="card-foot">
              <span class="state-tag">${m.on ? t.onTag : t.offTag}</span>
              <button class="btn">${t.settingsBtn}</button>
            </div>
          </article>
        `;
      }).join('');

      filterMods();
    }

    function toggleMod(idx) {
      mods[idx].on = !mods[idx].on;
      render();
    }

    function toggleLang() {
      lang = lang === 'ar' ? 'en' : 'ar';
      render();
    }

    function nextQuote() {
      qIdx = (qIdx + 1) % i18n[lang].quotes.length;
      render();
    }

    function filterMods() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        card.style.display = card.dataset.search.includes(q) ? 'flex' : 'none';
      });
    }

    render();
  </script>
</body>
</html>
