<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="gold">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wendo Studio — Flagship Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070609;
      --surface: rgba(20, 17, 24, 0.78);
      --surface-2: rgba(28, 24, 34, 0.9);
      --border: rgba(245, 158, 11, 0.16);
      --border-soft: rgba(255, 255, 255, 0.08);
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --power-on: #10b981;
      --power-glow: rgba(16, 185, 129, 0.55);
      --text: #fafaf9;
      --muted: #a8a29e;
      --code-bg: #0c0a0e;
    }

    html[data-theme="frost"] {
      --bg: #eef2f7;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-2: rgba(255, 255, 255, 0.95);
      --border: rgba(99, 102, 241, 0.22);
      --border-soft: rgba(15, 23, 42, 0.09);
      --accent: #4f46e5;
      --accent-2: #6366f1;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --text: #0f172a;
      --muted: #475569;
      --code-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.35s ease, color 0.25s ease;
      overflow-x: hidden;
    }
    html[dir="ltr"] body { font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; }

    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(55% 40% at 85% 5%, var(--accent-glow), transparent 65%),
        radial-gradient(45% 40% at 10% 90%, rgba(16, 185, 129, 0.12), transparent 65%);
      transition: background 0.35s ease;
    }

    .app {
      position: relative; z-index: 1;
      max-width: 1400px; margin: 0 auto;
      padding: 16px 22px 36px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Top Header + Telemetry */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      padding: 12px 20px; border-radius: 18px;
      background: var(--surface); border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.22);
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .emblem {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; display: grid; place-items: center; font-size: 18px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .telemetry {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .stat-chip {
      padding: 5px 11px; border-radius: 99px; font-size: 11.5px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-soft);
      display: flex; align-items: center; gap: 6px;
    }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--power-on); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }

    /* Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 235px 1fr 350px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1140px) { .workspace { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(22px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    }

    /* Sidebar */
    .sidebar { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .nav {
      padding: 10px 13px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); cursor: pointer; border: 1px solid transparent;
      display: flex; justify-content: space-between; align-items: center;
      background: transparent; font-family: inherit; transition: .18s;
    }
    .nav:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav.active {
      background: linear-gradient(135deg, var(--accent-glow), transparent);
      color: var(--text); border-color: var(--border);
    }

    /* Quote Banner */
    .quote-card {
      padding: 15px 20px; margin-bottom: 16px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-glow), rgba(16,185,129,0.06));
      border: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
    }

    /* Cards & Animations */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 14px; }
    .card {
      padding: 17px; border-radius: 17px;
      background: var(--surface); border: 1px solid var(--border-soft);
      display: flex; flex-direction: column; gap: 11px;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover { transform: translateY(-3px); border-color: var(--border); }
    .card.is-on {
      border-color: rgba(16,185,129,0.5);
      box-shadow: 0 10px 28px rgba(16,185,129,0.09);
    }

    /* Compact Precision Power Button (30px) */
    .pwr {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid rgba(148,163,184,0.35);
      background: radial-gradient(circle at 30% 30%, #27272a, #09090b);
      color: #71717a; display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pwr svg { width: 13px; height: 13px; }
    .pwr:hover { transform: scale(1.1); }
    .pwr.on {
      border-color: #34d399;
      background: radial-gradient(circle at 35% 30%, #10b981, #059669);
      color: #fff;
      box-shadow: 0 0 12px var(--power-glow), 0 0 22px rgba(16,185,129,0.22);
    }

    .btn {
      padding: 7px 13px; border-radius: 10px; border: 1px solid var(--border-soft);
      background: rgba(255,255,255,0.06); color: var(--text);
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .search {
      padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border-soft);
      background: var(--surface-2); color: var(--text);
      font-family: inherit; font-size: 12.5px; outline: none; width: 220px;
    }
    .search:focus { border-color: var(--accent); }

    /* Live Desktop Stage */
    .stage-panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .desktop-stage {
      height: 210px; border-radius: 14px; position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 25% 25%, var(--accent), transparent 55%),
        radial-gradient(circle at 75% 75%, #10b981, transparent 55%),
        linear-gradient(135deg, #111827, #1e1b4b);
      border: 1px solid var(--border); padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .mini-win {
      width: 84%; margin: 4px auto 0; border-radius: 10px; overflow: hidden;
      background: rgba(248,250,252,0.92); color: #0f172a;
      box-shadow: 0 14px 30px rgba(0,0,0,0.45); transition: all .3s ease;
    }
    .mini-win.dark { background: rgba(15,23,42,0.92); color: #f8fafc; }
    .mini-win.mica { backdrop-filter: blur(14px); background: rgba(15,23,42,0.62); border: 1px solid rgba(255,255,255,0.2); }
    .mini-taskbar {
      height: 26px; border-radius: 8px; background: rgba(15,23,42,0.85);
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: .3s;
    }
    .mini-taskbar.dock { width: 64%; margin: 0 auto; border-radius: 99px; background: rgba(15,23,42,0.62); backdrop-filter: blur(12px); }
    .tb-dot { width: 11px; height: 11px; border-radius: 3px; background: rgba(255,255,255,0.25); }
    .tb-dot.a { background: var(--accent-2); }

    /* Code Editor */
    .code-area {
      width: 100%; height: 290px; border-radius: 12px; padding: 14px;
      background: var(--code-bg); color: #e2e8f0; border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6;
      resize: none; outline: none; direction: ltr; text-align: left;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.68); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 520px; border-radius: 20px; padding: 22px;
      background: var(--surface-2); border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      display: flex; flex-direction: column; gap: 16px;
      animation: fadeUp 0.2s ease;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; inset-inline-end: 24px;
      padding: 11px 16px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--accent);
      color: var(--text); font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: all 0.25s ease; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="app">
    <!-- Header with Telemetry -->
    <header class="topbar">
      <div class="brand">
        <div class="emblem">👑</div>
        <div>
          <div style="font-size:15.5px; font-weight:800;" id="brandTitle">ويندو ستوديو · Wendo Studio</div>
          <div style="font-size:11.5px; color:var(--muted);" id="brandSub">الإصدار الاحترافي الكامل</div>
        </div>
      </div>

      <div class="telemetry">
        <div class="stat-chip"><span class="stat-dot"></span><span id="statHooks">2 Hooks</span></div>
        <div class="stat-chip" id="statCpu">⚡ CPU 1.4%</div>
        <div class="stat-chip" id="statRam">🧠 RAM 64 MB</div>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ Light Frost</button>
        <button class="btn" id="langBtn" onclick="toggleLang()">🌐 English</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Sidebar -->
      <aside class="panel sidebar">
        <button class="nav active" onclick="switchPage('mods', this)" id="navMods"><span>🧩 المودات</span><span>4</span></button>
        <button class="nav" onclick="switchPage('tweaks', this)" id="navTweaks"><span>⚡ تعديلات الويندوز</span><span>4</span></button>
        <button class="nav" onclick="switchPage('store', this)" id="navStore"><span>🛒 المتجر والمعاينة</span><span>↗</span></button>
        <button class="nav" onclick="switchPage('editor', this)" id="navEditor"><span>💻 محرر الكود</span><span>C++</span></button>
      </aside>

      <!-- Main Dynamic Area -->
      <section>
        <div class="quote-card">
          <div>
            <div style="font-size:14px; font-weight:700;" id="quoteText"></div>
            <div style="font-size:11.5px; color:var(--muted); margin-top:2px;" id="quoteAuthor"></div>
          </div>
          <button class="btn" onclick="nextQuote()">🔄</button>
        </div>

        <div id="pageContent"></div>
      </section>

      <!-- Live Stage & Activity -->
      <aside class="panel stage-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:14px;" id="stageTitle">🖥️ معاينة حية لسطح المكتب</strong>
          <span class="stat-chip" style="padding:3px 9px;">LIVE</span>
        </div>

        <div class="desktop-stage">
          <div class="mini-win" id="miniWin">
            <div style="padding:6px 10px; font-size:10px; font-weight:700; display:flex; justify-content:space-between; border-bottom:1px solid rgba(148,163,184,0.2);">
              <span id="miniWinTitle">📄 Wendo Preview</span><span>— ▢ ✕</span>
            </div>
            <div style="padding:12px; font-size:11px;" id="miniWinBody">جرّب التبديل وشاهد التأثير مباشرة! ✨</div>
          </div>
          <div class="mini-taskbar" id="miniTaskbar">
            <div class="tb-dot a"></div><div class="tb-dot"></div><div class="tb-dot"></div><div class="tb-dot"></div>
          </div>
        </div>

        <div style="font-size:12px; color:var(--muted); line-height:1.6;" id="activityLog">
          📡 آخر نشاط: جاهز لتشغيل ومعاينة المودات.
        </div>
      </aside>
    </div>
  </div>

  <!-- Interactive Settings / Preview Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modalTitle" style="font-size:17px;">⚙️ Mod Settings</h3>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <p id="modalDesc" style="font-size:13px; color:var(--muted); line-height:1.6;"></p>
      <div style="display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border-soft);">
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span id="modalSliderLabel">Opacity</span><strong id="modalSliderVal">88%</strong>
        </div>
        <input type="range" min="40" max="100" value="88" style="accent-color:var(--accent);" oninput="document.getElementById('modalSliderVal').textContent=this.value+'%'" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" onclick="closeModal()" id="modalCloseBtn">Close</button>
        <button class="btn btn-primary" onclick="saveModal()" id="modalSaveBtn">Save & Apply</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let lang = 'ar';
    let page = 'mods';
    let theme = 'gold';
    let qIdx = 0;

    const i18n = {
      ar: {
        brandTitle: 'ويندو ستوديو · Wendo Studio',
        brandSub: 'الإصدار الاحترافي الكامل',
        themeBtn: () => theme === 'gold' ? '☀️ Light Frost' : '👑 Obsidian Gold',
        langBtn: '🌐 English',
        navMods: ['🧩 المودات', '4'],
        navTweaks: ['⚡ تعديلات الويندوز', '4'],
        navStore: ['🛒 المتجر والمعاينة', '↗'],
        navEditor: ['💻 محرر الكود', 'C++'],
        stageTitle: '🖥️ معاينة حية لسطح المكتب',
        miniWinTitle: '📄 نافذة تجريبية — Wendo',
        miniWinBody: 'جرّب أزرار الباور أو التبويبات وشاهد التأثير مباشرة! ✨',
        onTxt: '⚡ يعمل الآن', offTxt: '⏸️ متوقف',
        optBtn: '🎛️ الخيارات', previewBtn: '👁️ معاينة', installBtn: '⬇️ تثبيت',
        compileBtn: '🔨 ترجمة وحقن DLL',
        closeBtn: 'إغلاق', saveBtn: 'حفظ وتطبيق',
        sliderLabel: 'درجة الشفافية',
        hooksTxt: (n) => `${n} مودات نشطة`,
        quotes: [
          { text: '«الفخامة في التفاصيل؛ واجهة هادئة، استجابة فورية، وتحكم كامل بلمسة واحدة.» 👑', author: '— Wendo Studio Flagship' },
          { text: '«الإبداع أن تصنع أداة قوية يشعر معها المستخدم بالبساطة من أول ثانية.» ✨', author: '— هندسة التجربة' }
        ]
      },
      en: {
        brandTitle: 'Wendo Studio',
        brandSub: 'Flagship Customization Suite',
        themeBtn: () => theme === 'gold' ? '☀️ Light Frost' : '👑 Obsidian Gold',
        langBtn: '🌐 العربية',
        navMods: ['🧩 Installed Mods', '4'],
        navTweaks: ['⚡ Windows Tweaks', '4'],
        navStore: ['🛒 Store & Preview', '↗'],
        navEditor: ['💻 Code Editor', 'C++'],
        stageTitle: '🖥️ Live Desktop Stage',
        miniWinTitle: '📄 Sample Window — Wendo',
        miniWinBody: 'Toggle power switches or tabs and watch the live preview react! ✨',
        onTxt: '⚡ Active', offTxt: '⏸️ Standby',
        optBtn: '🎛️ Options', previewBtn: '👁️ Preview', installBtn: '⬇️ Install',
        compileBtn: '🔨 Compile & Inject',
        closeBtn: 'Close', saveBtn: 'Save & Apply',
        sliderLabel: 'Transparency Level',
        hooksTxt: (n) => `${n} Active Hooks`,
        quotes: [
          { text: '“Luxury lives in the details — calm interface, instant response, effortless control.” 👑', author: '— Wendo Studio Flagship' },
          { text: '“True craft is building a powerful tool that feels intuitive from the very first second.” ✨', author: '— Experience Design' }
        ]
      }
    };

    const mods = [
      { id: 'mica', on: true, ar: { title: '🪟 زجاج Mica الشفاف', desc: 'خامة Acrylic وMica احترافية للنوافذ.' }, en: { title: '🪟 Translucent Mica', desc: 'Native Windows 11 Acrylic & Mica glass.' } },
      { id: 'dark', on: true, ar: { title: '🌙 الوضع الليلي للنوافذ', desc: 'تعتيم شريط العنوان والإطارات تلقائياً.' }, en: { title: '🌙 Dark Titlebars', desc: 'Force immersive dark borders & titlebars.' } },
      { id: 'dock', on: false, ar: { title: '🎨 شريط مهام عائم', desc: 'تحويل شريط المهام إلى Dock زجاجي أنيق.' }, en: { title: '🎨 Floating Taskbar Dock', desc: 'Sleek rounded floating glass taskbar.' } },
      { id: 'opacity', on: false, ar: { title: '✨ شفافية النوافذ', desc: 'تحكم دقيق في شفافية النوافذ المفتوحة.' }, en: { title: '✨ Glass Opacity', desc: 'Smooth adjustable window transparency.' } }
    ];

    const tweaks = [
      { id: 't1', on: true, ar: { title: '🌗 الوضع الليلي للويندوز', desc: 'تطبيق Dark Mode على النظام والبرامج فوراً.' }, en: { title: '🌗 Windows Dark Mode', desc: 'Apply dark theme across Windows & apps.' } },
      { id: 't2', on: true, ar: { title: '🕒 إظهار الثواني في الساعة', desc: 'عرض الثواني في ساعة شريط المهام.' }, en: { title: '🕒 Show Clock Seconds', desc: 'Display seconds in the system tray clock.' } },
      { id: 't3', on: false, ar: { title: '📂 إظهار امتدادات الملفات', desc: 'إظهار .exe و .cpp في مستكشف الملفات.' }, en: { title: '📂 Show File Extensions', desc: 'Always show file extensions in Explorer.' } },
      { id: 't4', on: true, ar: { title: '💎 تفعيل تأثيرات الشفافية', desc: 'تشغيل خامات Mica و Acrylic في النظام.' }, en: { title: '💎 Transparency Effects', desc: 'Enable system-wide Mica & Acrylic.' } }
    ];

    const storeItems = [
      { id: 'overhaulded-alt-tab', ar: { title: '🌀 Alt-Tab المطور', desc: 'مبدل نوافذ ثلاثي الأبعاد مع خلفية ضبابية.' }, en: { title: '🌀 Overhauled Alt-Tab', desc: 'Modern 3D carousel switcher with DWM blur.' } },
      { id: 'taskbar-volume', ar: { title: '🔊 التحكم بالصوت من الشريط', desc: 'ارفع واخفض الصوت بعجلة الماوس فوق شريط المهام.' }, en: { title: '🔊 Taskbar Volume Scroll', desc: 'Scroll mouse wheel over taskbar to adjust volume.' } }
    ];

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('activityLog').textContent = `📡 ${msg}`;
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function switchPage(p, btn) {
      page = p;
      document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    function toggleTheme() {
      theme = theme === 'gold' ? 'frost' : 'gold';
      document.documentElement.setAttribute('data-theme', theme);
      render();
    }

    function toggleLang() {
      lang = lang === 'ar' ? 'en' : 'ar';
      render();
    }

    function nextQuote() {
      qIdx = (qIdx + 1) % i18n[lang].quotes.length;
      render();
    }

    function toggleItem(list, id) {
      const item = list.find(x => x.id === id);
      if (item) {
        item.on = !item.on;
        showToast(`${item[lang].title}: ${item.on ? i18n[lang].onTxt : i18n[lang].offTxt}`);
      }
      render();
    }

    function openModal(title, desc) {
      const t = i18n[lang];
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('modalSliderLabel').textContent = t.sliderLabel;
      document.getElementById('modalCloseBtn').textContent = t.closeBtn;
      document.getElementById('modalSaveBtn').textContent = t.saveBtn;
      document.getElementById('modalBackdrop').classList.add('open');
    }
    function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
    function saveModal() { closeModal(); showToast(lang === 'ar' ? '✅ تم حفظ وتطبيق الإعدادات!' : '✅ Settings saved & applied!'); }

    function render() {
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('brandTitle').textContent = t.brandTitle;
      document.getElementById('brandSub').textContent = t.brandSub;
      document.getElementById('themeBtn').textContent = t.themeBtn();
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('stageTitle').textContent = t.stageTitle;
      document.getElementById('miniWinTitle').textContent = t.miniWinTitle;
      document.getElementById('miniWinBody').textContent = t.miniWinBody;

      ['navMods', 'navTweaks', 'navStore', 'navEditor'].forEach((id) => {
        const el = document.getElementById(id);
        el.children[0].textContent = t[id][0];
        el.children[1].textContent = t[id][1];
      });

      const q = t.quotes[qIdx % t.quotes.length];
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = q.author;

      const activeHooks = mods.filter(m => m.on).length;
      document.getElementById('statHooks').textContent = t.hooksTxt(activeHooks);

      const container = document.getElementById('pageContent');

      if (page === 'mods') {
        container.innerHTML = `<div class="grid">${mods.map(m => `
          <article class="card ${m.on ? 'is-on' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <div style="font-size:15px; font-weight:700;">${m[lang].title}</div>
                <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${m.on ? t.onTxt : t.offTxt}</div>
              </div>
              <button class="pwr ${m.on ? 'on' : ''}" onclick="toggleItem(mods, '${m.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
              </button>
            </div>
            <p style="font-size:12.8px; color:var(--muted); line-height:1.55;">${m[lang].desc}</p>
            <div style="display:flex; justify-content:flex-end;">
              <button class="btn" onclick="openModal('${m[lang].title}', '${m[lang].desc}')">${t.optBtn}</button>
            </div>
          </article>
        `).join('')}</div>`;
      } else if (page === 'tweaks') {
        container.innerHTML = `<div class="grid">${tweaks.map(tw => `
          <article class="card ${tw.on ? 'is-on' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <div style="font-size:15px; font-weight:700;">${tw[lang].title}</div>
                <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${tw.on ? t.onTxt : t.offTxt}</div>
              </div>
              <button class="pwr ${tw.on ? 'on' : ''}" onclick="toggleItem(tweaks, '${tw.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
              </button>
            </div>
            <p style="font-size:12.8px; color:var(--muted); line-height:1.55;">${tw[lang].desc}</p>
          </article>
        `).join('')}</div>`;
      } else if (page === 'store') {
        container.innerHTML = `<div class="grid">${storeItems.map(s => `
          <article class="card">
            <div style="font-size:15px; font-weight:700;">${s[lang].title}</div>
            <p style="font-size:12.8px; color:var(--muted); line-height:1.55;">${s[lang].desc}</p>
            <div style="display:flex; gap:8px; margin-top:auto;">
              <button class="btn" style="flex:1;" onclick="openModal('${s[lang].title}', '${s[lang].desc}')">${t.previewBtn}</button>
              <button class="btn btn-primary" style="flex:1;" onclick="showToast('⬇️ ${s[lang].title}')">${t.installBtn}</button>
            </div>
          </article>
        `).join('')}</div>`;
      } else if (page === 'editor') {
        container.innerHTML = `
          <div class="panel" style="padding:16px; display:flex; flex-direction:column; gap:12px;">
            <textarea class="code-area" spellcheck="false">#include "wendo_mod.h"

BOOL Wh_ModInit() {
    Wh_Log(L"Wendo Flagship Mod Loaded!");
    return TRUE;
}</textarea>
            <div style="display:flex; justify-content:flex-end;">
              <button class="btn btn-primary" onclick="showToast('✅ Compiled x64 DLL (0 errors)')">${t.compileBtn}</button>
            </div>
          </div>`;
      }

      // Live Stage sync
      const isDark = mods.find(m => m.id === 'dark')?.on;
      const isMica = mods.find(m => m.id === 'mica')?.on;
      const isDock = mods.find(m => m.id === 'dock')?.on;
      const isOpacity = mods.find(m => m.id === 'opacity')?.on;
      const win = document.getElementById('miniWin');
      win.className = 'mini-win' + (isDark ? ' dark' : '') + (isMica ? ' mica' : '');
      win.style.opacity = isOpacity ? '0.82' : '1';
      document.getElementById('miniTaskbar').className = 'mini-taskbar' + (isDock ? ' dock' : '');
    }

    render();
  </script>
</body>
</html>
