<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wendo Studio — Masterpiece Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060c;
      --glass: rgba(13, 18, 30, 0.68);
      --glass-strong: rgba(18, 24, 40, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --border-hi: rgba(255, 255, 255, 0.16);
      --accent: #7c3aed;
      --indigo: #6366f1;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    html[dir="ltr"] body { font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; }

    /* Subtle Ambient Aurora */
    .aurora {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(60% 45% at 80% 5%, rgba(99, 102, 241, 0.18), transparent 65%),
        radial-gradient(50% 45% at 15% 85%, rgba(16, 185, 129, 0.12), transparent 65%),
        radial-gradient(40% 35% at 50% 50%, rgba(124, 58, 237, 0.07), transparent 70%);
    }

    .app {
      position: relative; z-index: 1;
      max-width: 1380px; margin: 0 auto;
      padding: 18px 24px 36px;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* Floating Glass Header */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 12px 20px; border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 var(--border-hi), 0 16px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(24px);
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .emblem {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, #6366f1, #10b981);
      display: grid; place-items: center; font-size: 18px;
      box-shadow: 0 6px 20px rgba(99,102,241,0.4);
    }
    .pill {
      padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
      background: rgba(16,185,129,0.12); color: #6ee7b7;
      border: 1px solid rgba(16,185,129,0.3);
    }

    /* Main Split Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 230px 1fr 370px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: inset 0 1px 0 var(--border-hi), 0 20px 50px rgba(0,0,0,0.4);
      backdrop-filter: blur(24px);
    }

    /* Sidebar */
    .sidebar { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .nav {
      padding: 10px 13px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); cursor: pointer; border: 1px solid transparent;
      display: flex; justify-content: space-between; align-items: center;
      transition: .18s; background: transparent; font-family: inherit;
    }
    .nav:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav.active {
      background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(16,185,129,0.08));
      color: #fff; border-color: rgba(99,102,241,0.38);
    }

    /* Quote Strip */
    .quote-card {
      padding: 16px 20px; margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(16,185,129,0.06));
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .quote-text { font-size: 14px; font-weight: 700; line-height: 1.65; }
    .quote-sub { font-size: 11.5px; color: #a5b4fc; margin-top: 2px; }

    /* Mods Grid */
    .mods-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
    }
    .mod-card {
      padding: 17px; border-radius: 17px;
      background: rgba(15, 21, 35, 0.72);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 11px;
      transition: all .22s ease; cursor: pointer;
    }
    .mod-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.18); }
    .mod-card.is-on {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(160deg, rgba(16,185,129,0.08), rgba(15,21,35,0.85));
      box-shadow: 0 10px 30px rgba(16,185,129,0.08);
    }

    /* Precision Compact Power Button (30px) */
    .pwr {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid rgba(148, 163, 184, 0.25);
      background: radial-gradient(circle at 30% 30%, #1e293b, #090d16);
      color: #64748b; display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }
    .pwr svg { width: 13px; height: 13px; }
    .pwr:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.4); }
    .pwr.on {
      border-color: #34d399;
      background: radial-gradient(circle at 35% 30%, #10b981, #059669);
      color: #fff;
      box-shadow: 0 0 12px rgba(16,185,129,0.65), 0 0 24px rgba(16,185,129,0.25);
    }

    /* Live Interactive Windows 11 Desktop Stage */
    .stage-panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .desktop-stage {
      height: 220px; border-radius: 14px; position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 25% 25%, #3b82f6, transparent 55%),
        radial-gradient(circle at 75% 75%, #8b5cf6, transparent 55%),
        linear-gradient(135deg, #0f172a, #1e1b4b);
      border: 1px solid var(--border-hi);
      padding: 16px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .mini-win {
      width: 82%; margin: 6px auto 0; border-radius: 10px; overflow: hidden;
      background: rgba(248, 250, 252, 0.92); color: #0f172a;
      box-shadow: 0 14px 30px rgba(0,0,0,0.45);
      transition: all .3s ease;
    }
    .mini-win.dark { background: rgba(15, 23, 42, 0.92); color: #f8fafc; }
    .mini-win.mica { backdrop-filter: blur(14px); background: rgba(15, 23, 42, 0.62); border: 1px solid rgba(255,255,255,0.18); }
    .mini-win-bar {
      padding: 6px 10px; font-size: 10px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }
    .mini-win-body { padding: 12px; font-size: 11px; opacity: 0.85; }
    .mini-taskbar {
      height: 28px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .3s ease;
    }
    .mini-taskbar.dock {
      width: 66%; margin: 0 auto; border-radius: 99px;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    .tb-dot { width: 12px; height: 12px; border-radius: 4px; background: rgba(255,255,255,0.22); }
    .tb-dot.accent { background: #6366f1; }

    .btn {
      padding: 7px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text);
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.11); }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; }

    .search {
      width: 240px; padding: 8px 13px; border-radius: 10px;
      background: rgba(9, 13, 24, 0.75); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 12.5px; outline: none;
    }
    .search:focus { border-color: var(--indigo); }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="emblem">💎</div>
        <div>
          <div style="font-size:15.5px; font-weight:800;" id="brandTitle">ويندو ستوديو · Wendo Studio</div>
          <div style="font-size:11.5px; color:var(--muted);" id="brandSub">تحفة تخصيص الويندوز الاحترافية</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:9px; flex-wrap:wrap;">
        <input class="search" id="searchInput" oninput="render()" />
        <button class="btn" id="langBtn" onclick="toggleLang()">🌐 English</button>
        <span class="pill" id="activeCounter">⚡ 2 Active</span>
        <button class="btn btn-primary" id="newModBtn">✨ + مود جديد</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Sidebar -->
      <aside class="panel sidebar">
        <button class="nav active" id="navMods"><span>🧩 المودات</span><span>4</span></button>
        <button class="nav" id="navTweaks"><span>⚡ تعديلات فورية</span><span>6</span></button>
        <button class="nav" id="navStore"><span>🛒 المتجر والمعاينة</span><span>↗</span></button>
        <button class="nav" id="navProcs"><span>🎛️ العمليات</span><span>◈</span></button>
        <button class="nav" id="navSettings"><span>⚙️ الإعدادات</span><span>⚙</span></button>
      </aside>

      <!-- Center Mods Area -->
      <section>
        <div class="quote-card">
          <div>
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-sub" id="quoteAuthor"></div>
          </div>
          <button class="btn" id="quoteBtn" onclick="nextQuote()">🔄</button>
        </div>

        <div class="mods-grid" id="modsGrid"></div>
      </section>

      <!-- Right Live Preview Stage -->
      <aside class="panel stage-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:14px;" id="stageTitle">🖥️ معاينة حية لسطح المكتب</strong>
          <span class="pill" style="font-size:11px;">LIVE</span>
        </div>

        <div class="desktop-stage">
          <div class="mini-win" id="miniWin">
            <div class="mini-win-bar">
              <span id="miniWinTitle">📄 Notepad — Wendo Preview</span>
              <span>— ▢ ✕</span>
            </div>
            <div class="mini-win-body" id="miniWinBody">
              جرّب تشغيل أو إيقاف المودات وشاهد التأثير مباشرة هنا! ✨
            </div>
          </div>

          <div class="mini-taskbar" id="miniTaskbar">
            <div class="tb-dot accent"></div>
            <div class="tb-dot"></div>
            <div class="tb-dot"></div>
            <div class="tb-dot"></div>
          </div>
        </div>

        <div style="padding:12px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); font-size:12px; color:var(--muted); line-height:1.65;" id="stageHint">
          💡 التعديلات هنا تعكس حالة أزرار الباور فوراً: المودات المضيئة تطبق الزجاج، التعتيم، والـ Dock على المعاينة.
        </div>
      </aside>
    </div>
  </div>

  <script>
    let lang = 'ar';
    let qIdx = 0;

    const i18n = {
      ar: {
        brandTitle: 'ويندو ستوديو · Wendo Studio',
        brandSub: 'تحفة تخصيص الويندوز الاحترافية',
        langBtn: '🌐 English',
        newModBtn: '✨ + مود جديد',
        searchPh: '🔍 ابحث عن مود...',
        navMods: ['🧩 المودات', '4'],
        navTweaks: ['⚡ تعديلات فورية', '6'],
        navStore: ['🛒 المتجر والمعاينة', '↗'],
        navProcs: ['🎛️ العمليات', '◈'],
        navSettings: ['⚙️ الإعدادات', '⚙'],
        stageTitle: '🖥️ معاينة حية لسطح المكتب',
        miniWinTitle: '📄 نافذة تجريبية — Wendo',
        miniWinBody: 'جرّب تشغيل أزرار الباور وشاهد تأثير الزجاج والتعتيم والـ Dock مباشرة! ✨',
        stageHint: '💡 المعاينة تتفاعل لحظياً مع المودات المضيئة (Mica، التعتيم، وشريط المهام العائم).',
        onTxt: '⚡ يعمل',
        offTxt: '⏸️ متوقف',
        activeTxt: (n) => `⚡ ${n} قيد التشغيل`,
        quotes: [
          { text: '«الفخامة الحقيقية تكمن في البساطة المتقنة، حيث كل تفصيلة تؤدي دورها بصمت وأناقة.» 💎', author: '— فلسفة Wendo Studio' },
          { text: '«الأدوات العظيمة لا تكتفي بأداء الوظيفة، بل تمنحك متعة بصرية في كل مرة تفتحها.» ✨', author: '— هندسة الواجهات' },
          { text: '«تحكّم كامل بلمسة زر واحدة؛ القوة والجمال في مكان واحد.» 🚀', author: '— Wendo Engine' }
        ]
      },
      en: {
        brandTitle: 'Wendo Studio',
        brandSub: 'Flagship Windows Customization Suite',
        langBtn: '🌐 العربية',
        newModBtn: '✨ + New Mod',
        searchPh: '🔍 Search mods...',
        navMods: ['🧩 Mods', '4'],
        navTweaks: ['⚡ Quick Tweaks', '6'],
        navStore: ['🛒 Store & Preview', '↗'],
        navProcs: ['🎛️ Processes', '◈'],
        navSettings: ['⚙️ Settings', '⚙'],
        stageTitle: '🖥️ Live Desktop Preview',
        miniWinTitle: '📄 Sample Window — Wendo',
        miniWinBody: 'Toggle the power switches to preview Mica glass, dark mode, and floating dock live! ✨',
        stageHint: '💡 The live stage reacts in real time to active power switches (Mica, Dark Titlebar, Floating Dock).',
        onTxt: '⚡ Active',
        offTxt: '⏸️ Standby',
        activeTxt: (n) => `⚡ ${n} Active`,
        quotes: [
          { text: '“True luxury lies in refined simplicity, where every detail serves its purpose effortlessly.” 💎', author: '— Wendo Studio Philosophy' },
          { text: '“Great tools do more than function — they delight you every single time you open them.” ✨', author: '— Interface Craft' },
          { text: '“Complete control at the touch of a single switch; power and elegance unified.” 🚀', author: '— Wendo Engine' }
        ]
      }
    };

    const mods = [
      {
        id: 'mica', on: true,
        ar: { title: '🪟 زجاج Mica الشفاف', desc: 'خامة Acrylic وMica احترافية للنوافذ.' },
        en: { title: '🪟 Translucent Mica', desc: 'Native Windows 11 Acrylic & Mica glass.' }
      },
      {
        id: 'dark', on: true,
        ar: { title: '🌙 الوضع الليلي للنوافذ', desc: 'تعتيم شريط العنوان والإطارات تلقائياً.' },
        en: { title: '🌙 Dark Titlebars', desc: 'Force immersive dark borders & titlebars.' }
      },
      {
        id: 'dock', on: false,
        ar: { title: '🎨 شريط مهام عائم (Dock)', desc: 'تحويل شريط المهام إلى Dock زجاجي أنيق.' },
        en: { title: '🎨 Floating Taskbar Dock', desc: 'Sleek rounded floating glass taskbar.' }
      },
      {
        id: 'opacity', on: false,
        ar: { title: '✨ شفافية النوافذ', desc: 'تعتيم ناعم بدرجة شفافية قابلة للتعديل.' },
        en: { title: '✨ Glass Opacity', desc: 'Smooth adjustable window transparency.' }
      }
    ];

    function render() {
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('brandTitle').textContent = t.brandTitle;
      document.getElementById('brandSub').textContent = t.brandSub;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('newModBtn').textContent = t.newModBtn;
      document.getElementById('searchInput').placeholder = t.searchPh;
      document.getElementById('stageTitle').textContent = t.stageTitle;
      document.getElementById('miniWinTitle').textContent = t.miniWinTitle;
      document.getElementById('miniWinBody').textContent = t.miniWinBody;
      document.getElementById('stageHint').textContent = t.stageHint;

      ['navMods', 'navTweaks', 'navStore', 'navProcs', 'navSettings'].forEach((id) => {
        const el = document.getElementById(id);
        el.children[0].textContent = t[id][0];
        el.children[1].textContent = t[id][1];
      });

      const q = t.quotes[qIdx % t.quotes.length];
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = q.author;

      const onCount = mods.filter(m => m.on).length;
      document.getElementById('activeCounter').textContent = t.activeTxt(onCount);

      const query = document.getElementById('searchInput').value.toLowerCase();
      document.getElementById('modsGrid').innerHTML = mods
        .filter(m => (m.ar.title + m.en.title + m[lang].desc).toLowerCase().includes(query))
        .map((m) => {
          const c = m[lang];
          return `
            <article class="mod-card ${m.on ? 'is-on' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <div>
                  <div style="font-size:14.5px; font-weight:700;">${c.title}</div>
                  <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${m.on ? t.onTxt : t.offTxt}</div>
                </div>
                <button class="pwr ${m.on ? 'on' : ''}" onclick="toggleMod('${m.id}')" title="Power">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                  </svg>
                </button>
              </div>
              <p style="font-size:12.5px; color:#cbd5e1; line-height:1.55;">${c.desc}</p>
            </article>
          `;
        }).join('');

      // Update Live Desktop Stage
      const isDark = mods.find(m => m.id === 'dark')?.on;
      const isMica = mods.find(m => m.id === 'mica')?.on;
      const isDock = mods.find(m => m.id === 'dock')?.on;
      const isOpacity = mods.find(m => m.id === 'opacity')?.on;

      const win = document.getElementById('miniWin');
      win.className = 'mini-win' + (isDark ? ' dark' : '') + (isMica ? ' mica' : '');
      win.style.opacity = isOpacity ? '0.82' : '1';

      const tb = document.getElementById('miniTaskbar');
      tb.className = 'mini-taskbar' + (isDock ? ' dock' : '');
    }

    function toggleMod(id) {
      const m = mods.find(x => x.id === id);
      if (m) m.on = !m.on;
      render();
    }

    function toggleLang() {
      lang = lang === 'ar' ? 'en' : 'ar';
      render();
    }

    function nextQuote() {
      qIdx = (qIdx + 1) % i18n[lang].quotes.length;
      render();
    }

    render();
  </script>
</body>
</html>
